<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Playlist</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#f0f0f0;font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,200,80,0.06) 0%,transparent 60%);pointer-events:none}
.container{max-width:480px;margin:0 auto;padding:48px 20px 60px}
.header{text-align:center;margin-bottom:48px}
.header-label{font-size:20px;font-weight: bold;letter-spacing:5px;color:#888;margin-bottom:10px}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:3px;line-height:1;color:#fff}
.header h1 span{color:#e8a020}
.header-sub{margin-top:10px;font-size:16px;color:#555;letter-spacing:2px;font-weight:300}
.cards{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width: 768px) {
  .container{max-width:1080px;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));}
}
.card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;text-decoration:none;display:block;transition:transform 0.2s,box-shadow 0.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.card img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.1) 50%,transparent 100%)}
.card-body{position:absolute;bottom:0;left:0;right:0;padding:20px}
.card-num{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:4px;margin-bottom:4px;opacity:0.7}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1.1}
.card-meta{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;font-weight:300;letter-spacing:1px}
.card-arrow{position:absolute;top:50%;right:20px;transform:translateY(-50%);width:40px;height:40px;background:rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.c1 .card-num{color:#e8a020} .c1 .card-title{color:#fff}
.c2 .card-num{color:#ff6347} .c2 .card-title{color:#ffa07a}
.c3 .card-num{color:#9d6ff0} .c3 .card-title{color:#e8e0f8}
.c4 .card-num{color:#d47a00} .c4 .card-title{color:#f5b041}
.c5 .card-num{color:#d63a52} .c5 .card-title{color:#f2b3bc}
.c6 .card-num{color:#9468e8} .c6 .card-title{color:#e6dcf8}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-label">COLECCIÓN COMPLETA</div>
   <img src="caratulas/Logo_Indice.png" alt="El Chito" class="brand-logo" style="width: 70%; height: auto;">
    <!--<h1>El <span>Chito</span></h1>-->
    <div class="header-sub">6 álbumes &nbsp;·&nbsp; 61 canciones</div>
  </div>
  <div class="cards">
    <a href="playlist1.html" class="card c1">
      <img src="caratulas/Despertar.jpg" alt="El Despertar de la Carretera">
      <div class="card-overlay"></div>
      <div class="card-body">
        <div class="card-num">LP 01</div>
        <div class="card-title">El Despertar de la Carretera</div>
        <div class="card-meta">10 canciones</div>
      </div>
      <div class="card-arrow"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </a>
    <a href="playlist2.html" class="card c2">
      <img src="caratulas/Camino.jpg" alt="El Camino Chamánico">
      <div class="card-overlay"></div>

        <div class="card-num">LP 02</div>
        <div class="card-title">El Camino Chamánico</div>

    <a href="playlist3.html" class="card c3">

      <div class="card-arrow"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </a>
    <a href="playlist4.html" class="card c4">
      <img src="caratulas/Unplugged.jpg" alt="Unplugged">
      <div class="card-overlay"></div>

    <a href="playlist5.html" class="card c5">

    </a>
    <a href="playlist6.html" class="card c6">
      <img src="caratulas/Unplugged_III.jpg" alt="Unplugged III">
      <div class="card-overlay"></div>
      <div class="card-body">
        <div class="card-num">LP 06</div>
        <div class="card-title">Unplugged III</div>

      </div>
      <div class="card-arrow"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </a>
  </div>
</div>
</body>
</html>
