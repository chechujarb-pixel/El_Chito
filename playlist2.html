<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Camino Chamánico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--accent:#a0621a;--accent2:#6b3e0e;--glow:#c8852a;--text:#f0e4cc;--muted:#604830;--bar-h:4px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Raleway',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(160,98,26,0.1) 0%,transparent 60%),radial-gradient(ellipse at 20% 100%,rgba(100,60,10,0.08) 0%,transparent 50%);pointer-events:none;z-index:0}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:1px;padding:12px 0 0 24px;transition:color 0.2s;position:relative;z-index:1}
.back-btn:hover{color:var(--text)}
.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 100px}
.header{padding:16px 24px 28px;border-bottom:1px solid rgba(160,98,26,0.2)}
.cover-wrap{width:100%;aspect-ratio:1;overflow:hidden;border-radius:10px;margin-bottom:20px;position:relative}
.cover-wrap img.cover-img{width:100%;height:100%;object-fit:cover;display:block}
.cover-wrap img.logo-overlay{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.header-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;color:var(--accent);margin-bottom:10px}
.header h1{font-family:'Cinzel',serif;font-size:clamp(26px,7vw,36px);line-height:1.2;color:var(--text)}
.header h1 span{color:var(--glow)}
.header-meta{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:2px;font-weight:300}
.now-playing{margin:20px 16px;background:linear-gradient(160deg,rgba(160,98,26,0.1) 0%,rgba(6,8,13,0.8) 100%);border:1px solid rgba(160,98,26,0.25);border-radius:16px;padding:22px;box-shadow:0 0 40px rgba(160,98,26,0.06),inset 0 1px 0 rgba(255,255,255,0.04)}
.np-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:var(--accent);margin-bottom:8px}
.np-title{font-size:20px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-index{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.progress-wrap{margin-top:18px;cursor:pointer}
.progress-bg{width:100%;height:var(--bar-h);background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--glow));width:0%;border-radius:2px;transition:width 0.3s linear;box-shadow:0 0 8px rgba(200,133,42,0.4)}
.time-row{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:20px}
.btn{background:none;border:none;color:var(--muted);cursor:pointer;transition:color 0.2s,transform 0.15s;display:flex;align-items:center;justify-content:center}
.btn:hover{color:var(--text);transform:scale(1.1)}
.btn-play{width:54px;height:54px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:50%;color:#fff;box-shadow:0 0 24px rgba(160,98,26,0.4),0 4px 12px rgba(0,0,0,0.4)}
.btn-play:hover{transform:scale(1.08);box-shadow:0 0 36px rgba(200,133,42,0.6),0 4px 12px rgba(0,0,0,0.4);color:#fff}
.volume-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.volume-row svg{color:var(--muted);flex-shrink:0}
input[type=range]{flex:1;-webkit-appearance:none;height:var(--bar-h);background:rgba(255,255,255,0.08);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--glow);border-radius:50%;cursor:pointer;box-shadow:0 0 6px rgba(200,133,42,0.5)}
.tracklist{margin:8px 16px 0}
.track{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:10px;cursor:pointer;transition:background 0.18s;border-bottom:1px solid rgba(255,255,255,0.03)}
.track:hover{background:rgba(160,98,26,0.1)}
.track.active{background:rgba(160,98,26,0.15);border-color:transparent}
.track-num{font-family:'Cinzel',serif;font-size:13px;color:var(--muted);width:22px;text-align:center;flex-shrink:0;font-weight:700;}
.track.active .track-num{color:var(--glow)}
.track-info{flex:1;min-width:0}
.track-name{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .track-name{color:var(--glow)}
.track-dur{font-size:12px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:700;}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.track.active.playing .eq{display:flex}
.track.active.playing .track-num{display:none}
.eq span{width:3px;background:var(--glow);border-radius:1px;animation:eq 0.8s ease-in-out infinite alternate}
.eq span:nth-child(2){animation-delay:0.2s}.eq span:nth-child(3){animation-delay:0.4s}
@keyframes eq{0%{height:3px}100%{height:14px}}
.loading{display:none;width:18px;height:18px;border:2px solid rgba(160,98,26,0.2);border-top-color:var(--glow);border-radius:50%;animation:spin 0.7s linear infinite}
.track.active.buffering .loading{display:block}
.track.active.buffering .track-num,.track.active.buffering .eq{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
audio{display:none}
@media (min-width: 860px) {.container {max-width: 1080px;display: grid;grid-template-columns: 380px 1fr;column-gap: 40px;padding: 0 32px 100px;align-items: start;}
.back-btn {grid-column: 1 / -1;padding-left: 0;}
.header-text {grid-column: 1;grid-row: 2;padding-top: 4px;}
.header .cover-wrap {grid-column: 1;grid-row: 3;width: 380px;margin-bottom: 0;}
.header {display: contents;}
.now-playing {grid-column: 2;grid-row: 2;margin: 20px 0 0;}
.tracklist {grid-column: 2;grid-row: 3;margin: 24px 0 0;max-height: calc(100vh - 48px);overflow-y: auto;position: sticky;top: 24px;}
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">
  <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  Volver
</a>
  <div class="header">
    <div class="cover-wrap">
      <img src="Portada_Camino_Logo2.jpg" class="cover-img" alt="Portada Camino">
      <img src="Logo Marron Claro.png" class="logo-overlay" alt="Logo">
    </div>
    <div class="header-text">
      <div class="header-label">PLAYLIST</div>
      <h1>El Camino <span>Chamánico</span></h1>
      <div class="header-meta">10 CANCIONES • 1960s PSYCHEDELIC ROCK</div>
    </div>
  </div>

  <div class="now-playing">
    <div class="np-label">REPRODUCEN OAHORA</div>
    <div class="np-title" id="npTitle">Selecciona una canción</div>
    <div class="np-index" id="npIndex">- / -</div>
    
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnPrev" title="Anterior">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="btnPlay" title="Reproducir">
        <svg id="iconPlay" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" id="btnNext" title="Siguiente">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volRange" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <div class="tracklist" id="tracklist"></div>
</div>

<audio id="audio"></audio>

<script>
const tracks = [
  { title: "01. El Viaje Chamánico", src: "audio/01_El_Viaje_Chamanico.mp3", duration: "3:45" },
  { title: "02. Fuego Ritual", src: "audio/02_Fuego_Ritual.mp3", duration: "4:12" },
  { title: "03. Danza del Espíritu", src: "audio/03_Danza_del_Espiritu.mp3", duration: "3:58" },
  { title: "04. Sombras de la Noche", src: "audio/04_Sombras_de_la_Noche.mp3", duration: "4:30" },
  { title: "05. Visiones del Jagua", src: "audio/05_Visiones_del_Jaguar.mp3", duration: "5:01" },
  { title: "06. Eco Ancestral", src: "audio/06_Eco_Ancestral.mp3", duration: "3:20" },
  { title: "07. Cantos del Viento", src: "audio/07_Cantos_del_Viento.mp3", duration: "4:15" },
  { title: "08. El Despertar", src: "audio/08_El_Despertar.mp3", duration: "3:50" },
  { title: "09. Niebla Psicodélica", src: "audio/09_Niebla_Psicodelica.mp3", duration: "4:42" },
  { title: "10. Regreso al Origen", src: "audio/10_Regreso_al_Origen.mp3", duration: "5:10" }
];

let currentIndex = -1;
const audio = document.getElementById('audio');
const btnPlay = document.getElementById('btnPlay');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const npTitle = document.getElementById('npTitle');
const npIndex = document.getElementById('npIndex');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const tracklistEl = document.getElementById('tracklist');
const volRange = document.getElementById('volRange');

function initTracklist() {
  tracklistEl.innerHTML = tracks.map((t, i) => `
    <div class="track" onclick="playTrack(${i})">
      <div class="track-num">${i + 1}</div>
      <div class="eq"><span></span><span></span><span></span></div>
      <div class="loading"></div>
      <div class="track-info">
        <div class="track-name">${t.title}</div>
      </div>
      <div class="track-dur">${t.duration}</div>
    </div>
  `).join('');
}

function playTrack(index) {
  if (index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const track = tracks[currentIndex];
  
  audio.src = track.src;
  audio.play();
  
  npTitle.textContent = track.title;
  npIndex.textContent = `CANCIÓN ${currentIndex + 1} DE ${tracks.length}`;
  
  updateUI();
}

function updateUI() {
  document.querySelectorAll('.track').forEach((el, i) => {
    if (i === currentIndex) {
      el.classList.add('active');
      if (!audio.paused) {
        el.classList.add('playing');
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        el.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }
    } else {
      el.classList.remove('active', 'playing', 'buffering');
    }
  });
}

btnPlay.addEventListener('click', () => {
  if (currentIndex === -1) {
    playTrack(0);
  } else if (audio.paused) {
    audio.play();
    updateUI();
  } else {
    audio.pause();
    updateUI();
  }
});

document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentIndex > 0) playTrack(currentIndex - 1);
});

document.getElementById('btnNext').addEventListener('click', () => {
  if (currentIndex < tracks.length - 1) playTrack(currentIndex + 1);
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = `${pct}%`;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (currentIndex < tracks.length - 1) {
    playTrack(currentIndex + 1);
  } else {
    updateUI();
  }
});

document.getElementById('progressWrap').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  audio.currentTime = (clickX / rect.width) * audio.duration;
});

volRange.addEventListener('input', (e) => {
  audio.volume = e.target.value;
});

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

initTracklist();
</script>
</body>
</html>
