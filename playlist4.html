<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unplugged</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root {--bg: #2b1f14;--surface: #3a2b1d;--accent: #d4a574;--accent2: #a67c52;--text: #f8f1e7;--muted: #a08a6e;--bar-h: 4px;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4}

.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:1px;padding:12px 0 0 24px;transition:color 0.2s}
.back-btn:hover{color:var(--text)}

.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 100px}
.header{padding:16px 24px 24px;border-bottom:1px solid rgba(212,165,116,0.15)}
.cover-wrap{width:100%;aspect-ratio:1;overflow:hidden;border-radius:10px;margin-bottom:20px;position:relative}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.header-label{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:4px;color:var(--accent);margin-bottom:8px}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,9vw,48px);line-height:1;letter-spacing:2px;color:var(--text)}
.header h1 span{color:var(--accent)}
.header-meta {display: flex;align-items: center;gap: 16px; /* Separación entre el grupo de canciones y el tiempo */margin-top: 8px;font-size: 13px;color: var(--muted);font-weight: 300;letter-spacing: 1px;}
.header-meta > span {display: inline-flex;align-items: center;gap: 4px;}
.header-meta .material-symbols-outlined {font-size: 16px;}
.now-playing{margin:20px 16px;background:linear-gradient(135deg,#1e1508 0%,#2a1c0a 100%);border:1px solid rgba(212,165,116,0.2);border-radius:12px;padding:20px;position:relative;overflow:hidden}
.now-playing::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(212,165,116,0.15) 0%,transparent 70%);border-radius:50%}
.np-label{font-family:'Roboto Condensed',sans-serif;font-size:10px;letter-spacing:3px;color:var(--accent);font-family:'Bebas Neue',sans-serif;margin-bottom:6px}
.np-title{font-family:'Roboto Condensed',sans-serif;font-size:20px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-index{font-family:'Roboto Condensed',sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
.progress-wrap{margin-top:16px;cursor:pointer}
.progress-bg{width:100%;height:var(--bar-h);background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%;border-radius:2px;transition:width 0.3s linear}
.time-row{font-family:'Roboto Condensed',sans-serif;display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:20px}
.btn{background:none;border:none;color:var(--muted);cursor:pointer;transition:color 0.2s,transform 0.15s;display:flex;align-items:center;justify-content:center}
.btn:hover{color:var(--text);transform:scale(1.1)}
.btn-play{width:52px;height:52px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:50%;color:#000;box-shadow:0 4px 20px rgba(212,165,116,0.35)}
.btn-play:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(212,165,116,0.5);color:#000}
.volume-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.volume-row svg{color:var(--muted);flex-shrink:0}
input[type=range]{flex:1;-webkit-appearance:none;height:var(--bar-h);background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}
.tracklist{margin:8px 16px 0}
.track{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:8px;cursor:pointer;transition:background 0.18s;border-bottom:1px solid rgba(255,255,255,0.04)}
.track:hover{background:rgba(212,165,116,0.07)}
.track.active{background:rgba(212,165,116,0.12);border-color:transparent}
.track-num{font-family:'Roboto Condensed',sans-serif;font-size:16px;color:var(--muted);width:22px;text-align:center;flex-shrink:0}
.track.active .track-num{color:var(--accent)}
.track-info{flex:1;min-width:0}
.track-name{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .track-name{color:var(--accent)}
.track-dur{font-family:'Roboto Condensed',sans-serif;font-size:14px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.track.active.playing .eq{display:flex}
.track.active.playing .track-num{display:none}
.eq span{width:3px;background:var(--accent);border-radius:1px;animation:eq 0.8s ease-in-out infinite alternate}
.eq span:nth-child(2){animation-delay:0.2s}.eq span:nth-child(3){animation-delay:0.4s}
@keyframes eq{0%{height:3px}100%{height:14px}}
.loading{display:none;width:18px;height:18px;border:2px solid rgba(212,165,116,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
.track.active.buffering .loading{display:block}
.track.active.buffering .track-num,.track.active.buffering .eq{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
audio{display:none}
.back-btn{position:relative;z-index:1}

.brand-logo{display:block;width:42%;max-width:150px;height:auto;margin:16px auto 0}
.brand-logo-header{display:none}

.lyrics-panel{margin:22px 16px 0;border:1px solid rgba(212,165,116,.28);border-radius:16px;background:linear-gradient(135deg,#1e1508 0%,#2a1c0a 100%);overflow:hidden;color:var(--text)}
.lyrics-panel summary{cursor:pointer;list-style:none;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;letter-spacing:.08em;font-size:12px;color:var(--accent)}
.lyrics-panel summary::-webkit-details-marker{display:none}
.lyrics-panel summary:after{content:'＋';font-size:18px;line-height:1}
.lyrics-panel[open] summary:after{content:'−'}
.lyrics-content{position:relative;border-top:1px solid rgba(212,165,116,.2);padding:16px 18px 20px;max-height:340px;overflow:auto;text-align:center;scroll-behavior:smooth}
.lyrics-spacer{height:120px}
.lyrics-now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500;letter-spacing:0;color:var(--accent)}
.lyrics-preview{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lyrics-preview .lyrics-now{flex:none}
.lyrics-next{display:block;min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:400;letter-spacing:0;line-height:1.4;color:var(--muted)}
.lyrics-panel[open] .lyrics-next{display:none}
.lyrics-line{padding:7px 4px;color:rgba(248,241,231,.55);font-size:15px;line-height:1.5;transition:color .18s,transform .18s}
.lyrics-line.active{color:var(--accent);font-weight:700;text-shadow:0 0 18px rgba(212,165,116,.45);transform:scale(1.025)}
.lyrics-empty{padding:12px 4px;color:rgba(248,241,231,.55);font-size:13px;line-height:1.6}

#audioStatus{max-width:720px;margin:10px auto;padding:0 18px;color:#e07060;font-size:13px;line-height:1.5;text-align:center}

/* Escritorio: carátula a la altura del panel de letras; lista justo debajo de las letras */
@media (min-width:860px){
  .container{max-width:1080px;display:grid;grid-template-columns:380px 1fr;column-gap:40px;padding:0 32px 100px;align-items:start}
  .back-btn{grid-column:1 / -1;padding-left:0}
  .header{display:contents}
  .header-text{grid-column:1;grid-row:2;padding-top:4px}
  .header .cover-wrap{grid-column:1;grid-row:3 / span 2;width:380px;margin:24px 0 0}
  .now-playing{grid-column:2;grid-row:2;margin:20px 0 0}
  .lyrics-panel{grid-column:2;grid-row:3;margin:24px 0 0}
  .tracklist{grid-column:2;grid-row:4;margin:18px 0 0}
  .brand-logo{display:none}
  .brand-logo-header{display:block;width:130px;max-width:130px;height:auto;margin:0 0 14px}
}
</style>
</head>
<body>
<div class="container">
  <img src="caratulas/Logo_Unplugged.png" alt="El Chito" class="brand-logo">

  <a href="index.html" class="back-btn">
    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Volver
  </a>
  <div class="header">
    <div class="cover-wrap"><img src="caratulas/Unplugged.jpg" alt="cover"></div>
    <div class="header-text">
      <img src="caratulas/Logo_Unplugged.png" alt="El Chito" class="brand-logo-header">
      <div class="header-label">▶ LP 04</div>
      <h1>Un<span>Plugged</span></h1>
      <div class="header-meta"><span><span class="material-symbols-outlined">music_note</span>12 canciones</span><span><span class="material-symbols-outlined">timer</span>47:51</span></div>
    </div>
  </div>
  <div class="now-playing">
    <div class="np-label">▶ REPRODUCIENDO</div>
    <div class="np-title" id="npTitle">—</div>
    <div class="np-index" id="npIndex">Cargando...</div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
      <div class="time-row"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div>
    </div>
    <div class="controls">
      <button class="btn" onclick="prev()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="btn btn-play" onclick="togglePlay()">
        <svg id="iconPlay" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" onclick="next()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>
    </div>
    <div class="volume-row">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.02" value="0.85" oninput="setVolume(this.value)">
    </div>
  </div>
  <details class="lyrics-panel" id="lyricsPanel">
    <summary><span class="lyrics-preview"><span id="lyricsTrackName" class="lyrics-now">♪</span><span id="lyricsNext" class="lyrics-next"></span></span></summary>
    <div class="lyrics-content" id="lyricsContent" aria-live="polite">
      <p class="lyrics-empty">Cargando letra…</p>
    </div>
  </details>
  <div class="tracklist" id="tracklist"></div>
</div>
<audio id="player" preload="auto"></audio>
<div id="audioStatus" role="status" aria-live="polite"></div>
<script>
// Audio en OneDrive/SharePoint. Letras (.lrc) en el repositorio: letras/<título>.lrc
const LRC_FOLDER='letras/';
const tracks=[
  {title:"Quemas",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQCCvmnPbLpjQ40yZaeHucOcAc1IzDnCP-QWyKiqcbpZHuE?e=lMHMTA&download=1"},
  {title:"Eres Tú",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQC6PUIW7k5GTJ3CCYmP-DaOAW5HOLoFdscQNniVO5j4_bA?e=FDYMIB&download=1"},
  {title:"Animales",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQCdJpHq5NlbRKuIXbsy1ES5AcTOAOfNaHFeoxdUMYVFV1c?e=LfTvoZ&download=1"},
  {title:"Sigo Tu Esencia",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQDTaokUiItaQp2GPFGItOOCAWkjNK7PY8yJ-TSodXRQQLQ?e=WbPpW9f&download=1"},
  {title:"Nuestros Caminos",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQAPT3dQlH0nQZhAT_mUXpoqAZ6zzNgYiEqSsY3XuUsq3l8?e=eiwacC&download=1"},
  {title:"Es el Sino de la Vida",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQC7n9zfkDL2SKF3AchqDmwyARK3KQzlrTPHLQyrDCTrEVQ?e=emXdgb&download=1"},
  {title:"No Pares",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQBMB2ZvUO6SSJE01OpvkkazAW1muGK1tmwYa9CswL4KowQ?e=R1SlGv&download=1"},
  {title:"Fusionados",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQCSQjgVKoI7TKF2EYcTi3LlAU_An8Iqt4UGLotEpdMY5j8?e=FOQWs4&download=1"},
  {title:"Sin Valor",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQDfVU6qw-nqSofRZ5VAexEYAf-koLeJsqTHLoFN8_eeHMM?e=Khz2qI&download=1"},
  {title:"Días Enteros",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQC1y_XIdKqsSqMFlUM5tCsbAXjcVudIWmAtr41LzCrp6gM?e=XKnHnb&download=1"},
  {title:"El Blues de la Triste Figura",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQCkv3Y6vKYoRr6qIPuSqnKvAQGntjLPQM0b6guWpmn-f0E?e=i7bTUq&download=1"},
  {title:"El País de las Almas Perdidas",url:"https://1drv.ms/u/c/01a414479ed4a10f/IQBKLC-NxIUWTqjnwb2HZygvARVPlmgCyzkx9ZSl58IKbms?e=4Lhi35&download=1"}
];

const audio=document.getElementById('player');
const lyricsBox=document.getElementById('lyricsContent');
const lyricsNow=document.getElementById('lyricsTrackName');
const lyricsNext=document.getElementById('lyricsNext');
let current=-1,lyricLines=[],activeLyricIndex=-1,lyricRequestToken=0;
let userScrollUntil=0,userScrollTimer=null;

/* ---------- Letras ---------- */
function parseLrc(text){
  const lines=[];
  for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n/)){
    const matches=[...raw.matchAll(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    const lyric=raw.replace(/\[[^\]]+\]/g,'').trim();
    for(const m of matches){
      const fraction=m[3]||'0';
      const hundredths=fraction.length===1?Number(fraction)*10:fraction.length===2?Number(fraction):Number(fraction)/10;
      lines.push({time:Number(m[1])*60+Number(m[2])+hundredths/100,text:lyric});
    }
  }
  return lines.sort((a,b)=>a.time-b.time);
}
function escapeLyrics(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function setLyricsMessage(msg){lyricLines=[];lyricsBox.innerHTML=`<p class="lyrics-empty">${msg}</p>`;}
function renderLyrics(){
  if(!lyricLines.length){setLyricsMessage('El archivo de letra no contiene líneas con marcas de tiempo válidas.');return;}
  lyricsBox.innerHTML='<div class="lyrics-spacer"></div>'+lyricLines.map((line,i)=>`<div class="lyrics-line" data-lyric-index="${i}">${escapeLyrics(line.text)||'♪'}</div>`).join('')+'<div class="lyrics-spacer"></div>';
  lyricsBox.scrollTop=0;
  activeLyricIndex=-1;
  syncLyrics();
}
async function loadLyrics(i){
  const token=++lyricRequestToken;
  const title=tracks[i].title;
  lyricLines=[];activeLyricIndex=-1;
  lyricsNow.textContent='♪';
  lyricsNext.textContent='';
  setLyricsMessage('Cargando letra…');
  try{
    const r=await fetch(LRC_FOLDER+encodeURIComponent(title)+'.lrc',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    if(token!==lyricRequestToken)return;
    lyricLines=parseLrc(text);
    renderLyrics();
  }catch(err){
    if(token!==lyricRequestToken)return;
    console.warn('[Letras] No se pudo cargar',title,err);
    setLyricsMessage('No hay letra disponible para esta canción.');
  }
}
function scrollToLyric(el,instant){
  if(!lyricsBox.clientHeight)return;
  const top=el?el.offsetTop-lyricsBox.clientHeight/2+el.offsetHeight/2:0;
  lyricsBox.scrollTo({top:Math.max(0,top),behavior:instant?'instant':'smooth'});
}
function syncLyrics(){
  if(!lyricLines.length)return;
  const t=audio.currentTime||0;
  let idx=-1;
  for(let i=0;i<lyricLines.length;i++){if(lyricLines[i].time<=t)idx=i;else break;}
  if(idx===activeLyricIndex)return;
  activeLyricIndex=idx;
  document.querySelectorAll('.lyrics-line.active').forEach(el=>el.classList.remove('active'));
  const el=idx>=0?document.querySelector(`[data-lyric-index="${idx}"]`):null;
  if(el)el.classList.add('active');
  lyricsNow.textContent=(idx>=0&&lyricLines[idx].text)||'♪';
  let nx='';for(let j=idx+1;j<lyricLines.length;j++){if(lyricLines[j].text){nx=lyricLines[j].text;break;}}
  lyricsNext.textContent=nx;
  if(Date.now()>=userScrollUntil)scrollToLyric(el);
}
// Si el usuario desplaza la letra a mano, se pausa el seguimiento 4 s
['wheel','touchmove','pointerdown'].forEach(ev=>lyricsBox.addEventListener(ev,()=>{
  userScrollUntil=Date.now()+4000;
  clearTimeout(userScrollTimer);
  userScrollTimer=setTimeout(()=>scrollToLyric(document.querySelector('.lyrics-line.active')),4000);
},{passive:true}));
// Al desplegar el panel, colocar la letra en la línea actual
document.getElementById('lyricsPanel').addEventListener('toggle',e=>{
  if(e.target.open){userScrollUntil=0;requestAnimationFrame(()=>scrollToLyric(document.querySelector('.lyrics-line.active'),true));}
});

/* ---------- Reproductor ---------- */
function fmt(s){if(isNaN(s)||s===undefined)return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec.toString().padStart(2,'0')}`}
function setAudioStatus(message=''){document.getElementById('audioStatus').textContent=message}
function trackEl(){return document.getElementById(`track${current}`)}
function renderList(){document.getElementById('tracklist').innerHTML=tracks.map((t,i)=>`<div class="track" id="track${i}" onclick="loadTrack(${i})"><div class="eq"><span></span><span></span><span></span></div><div class="loading"></div><div class="track-num">${i+1}</div><div class="track-info"><div class="track-name">${t.title}</div></div><div class="track-dur" id="dur${i}">--:--</div></div>`).join('')}
function setActive(i){
  document.querySelectorAll('.track').forEach(el=>el.classList.remove('active','playing','buffering'));
  if(i>=0)document.getElementById(`track${i}`).classList.add('active');
  document.getElementById('npTitle').textContent=i>=0?tracks[i].title:'—';
  document.getElementById('npIndex').textContent=i>=0?`${i+1} de ${tracks.length}`:'—';
}
function loadTrack(i){
  current=i;setActive(i);loadLyrics(i);
  trackEl().classList.add('buffering');
  setAudioStatus();
  audio.src=tracks[i].url;audio.volume=document.getElementById('volume').value;audio.load();
  audio.play().catch(()=>setAudioStatus('No se ha podido iniciar la reproducción. Pulsa ▶ para intentarlo. Si continúa, revisa que el archivo esté compartido con acceso mediante enlace.'));
}
function togglePlay(){if(current<0){loadTrack(0);return}if(audio.paused)audio.play();else audio.pause()}
function prev(){if(current>0)loadTrack(current-1)}
function next(){if(current<tracks.length-1)loadTrack(current+1)}
function setVolume(v){audio.volume=v}
function setPlayIcons(playing){document.getElementById('iconPlay').style.display=playing?'none':'';document.getElementById('iconPause').style.display=playing?'':'none'}

audio.addEventListener('playing',()=>{setAudioStatus();setPlayIcons(true);const el=trackEl();if(el){el.classList.remove('buffering');el.classList.add('playing')}});
audio.addEventListener('pause',()=>{setPlayIcons(false);const el=trackEl();if(el)el.classList.remove('playing')});
audio.addEventListener('waiting',()=>{const el=trackEl();if(el){el.classList.remove('playing');el.classList.add('buffering')}});
audio.addEventListener('error',()=>{const el=trackEl();if(el)el.classList.remove('buffering','playing');setAudioStatus('Error al cargar el audio. Comprueba el permiso “Cualquier persona con el vínculo” y prueba el enlace en una pestaña nueva.')});
audio.addEventListener('timeupdate',()=>{syncLyrics();const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('timeCurrent').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration)});
audio.addEventListener('loadedmetadata',()=>{document.getElementById(`dur${current}`).textContent=fmt(audio.duration);document.getElementById('timeTotal').textContent=fmt(audio.duration)});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1);else setPlayIcons(false)});
document.getElementById('progressWrap').addEventListener('click',e=>{if(!audio.duration)return;const rect=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration});

function preloadDurations(){tracks.forEach((t,i)=>{const a=new Audio();a.preload='metadata';a.src=t.url;a.addEventListener('loadedmetadata',()=>{const el=document.getElementById(`dur${i}`);if(el)el.textContent=fmt(a.duration)})})}
renderList();
preloadDurations();
window.addEventListener('load',()=>{current=0;setActive(0);loadLyrics(0);audio.src=tracks[0].url;audio.load()});
</script>
</body>
</html>
