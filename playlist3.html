<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Viaje Interior a la Oscuridad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{--bg:#050508;--accent:#7b4fd4;--accent2:#4a2a8a;--glow:#9d6ff0;--text:#e8e0f5;--muted:#504870;--bar-h:4px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(123,79,212,0.08) 0%,transparent 60%),radial-gradient(ellipse at 20% 100%,rgba(74,42,138,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}

.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:1px;padding:12px 0 0 24px;transition:color 0.2s;position:relative;z-index:1}
.back-btn:hover{color:var(--text)}
 
.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 100px}
.header{padding:16px 24px 32px;border-bottom:1px solid rgba(123,79,212,0.2)}
.cover-wrap{width:100%;aspect-ratio:1;overflow:hidden;border-radius:10px;margin-bottom:20px}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.header-label{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:4px;color:var(--accent);font-weight:400;margin-bottom:10px}
.header h1{font-family:'Playfair Display',serif;font-size:clamp(26px,7vw,36px);line-height:1.2;color:var(--text)}
.header h1 em{font-style:italic;color:var(--glow);text-shadow:0 0 20px rgba(157,111,240,0.3)}
.header-meta {display: flex;align-items: center;gap: 16px; /* Separación entre el grupo de canciones y el tiempo */margin-top: 8px;font-size: 13px;color: var(--muted);font-weight: 300;letter-spacing: 1px;}
.header-meta > span {display: inline-flex;align-items: center;gap: 4px;}
.header-meta .material-symbols-outlined {font-size: 16px;}
.now-playing{margin:20px 16px;background:linear-gradient(160deg,rgba(123,79,212,0.1) 0%,rgba(5,5,8,0.9) 100%);border:1px solid rgba(123,79,212,0.25);border-radius:16px;padding:22px;box-shadow:0 0 40px rgba(123,79,212,0.06),inset 0 1px 0 rgba(255,255,255,0.04)}
.np-label{family:'Roboto Condensed',sans-serif;font-font-size:9px;letter-spacing:4px;color:var(--accent);font-weight:400;margin-bottom:8px}
.np-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-index{family:'Roboto Condensed',sans-serif;font-font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.progress-wrap{margin-top:18px;cursor:pointer}
.progress-bg{width:100%;height:var(--bar-h);background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--glow));width:0%;border-radius:2px;transition:width 0.3s linear;box-shadow:0 0 8px rgba(157,111,240,0.5)}
.time-row{family:'Roboto Condensed',sans-serif;font-display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:20px}
.btn{background:none;border:none;color:var(--muted);cursor:pointer;transition:color 0.2s,transform 0.15s;display:flex;align-items:center;justify-content:center}
.btn:hover{color:var(--text);transform:scale(1.1)}
.btn-play{width:54px;height:54px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:50%;color:#fff;box-shadow:0 0 24px rgba(123,79,212,0.5),0 4px 12px rgba(0,0,0,0.4)}
.btn-play:hover{transform:scale(1.08);box-shadow:0 0 36px rgba(157,111,240,0.7),0 4px 12px rgba(0,0,0,0.4);color:#fff}
.volume-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.volume-row svg{color:var(--muted);flex-shrink:0}
input[type=range]{flex:1;-webkit-appearance:none;height:var(--bar-h);background:rgba(255,255,255,0.08);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--glow);border-radius:50%;cursor:pointer;box-shadow:0 0 6px rgba(255,89,100,0.5)}
.tracklist{margin:8px 16px 0}
.track{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:10px;cursor:pointer;transition:background 0.18s;border-bottom:1px solid rgba(255,255,255,0.03)}
.track:hover{background:rgba(255,48,59,0.1)}
.track.active{background:rgba(255,48,59,0.15);border-color:transparent}
.track-num{font-family:'Roboto Condensed',sans-serif;;font-size:16px;color:var(--muted);width:22px;text-align:center;flex-shrink:0;font-weight:700;}
.track.active .track-num{color:var(--glow)}
.track-info{flex:1;min-width:0}
.track-name{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .track-name{color:var(--glow)}
.track-dur{font-family:'Roboto Condensed',sans-serif;font-size:12px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:700;}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.track.active.playing .eq{display:flex}
.track.active.playing .track-num{display:none}
.eq span{width:3px;background:var(--glow);border-radius:1px;animation:eq 0.8s ease-in-out infinite alternate}
.eq span:nth-child(2){animation-delay:0.2s}.eq span:nth-child(3){animation-delay:0.4s}
@keyframes eq{0%{height:3px}100%{height:14px}}
.loading{display:none;width:18px;height:18px;border:2px solid rgba(255,48,59,0.2);border-top-color:var(--glow);border-radius:50%;animation:spin 0.7s linear infinite}
.track.active.buffering .loading{display:block}
.track.active.buffering .track-num,.track.active.buffering .eq{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
audio{display:none}
@media (min-width: 860px) {.container {max-width: 1080px;display: grid;grid-template-columns: 380px 1fr;column-gap: 40px;padding: 0 32px 100px;align-items: start;}
.back-btn {grid-column: 1 / -1;padding-left: 0;}
.header-text {grid-column: 1;grid-row: 2;padding-top: 4px;}
.header .cover-wrap {grid-column: 1;grid-row: 3;width: 380px;margin-bottom: 0;}
.header {display: contents;}
.now-playing {grid-column: 2;grid-row: 2;margin: 20px 0 0;}
.tracklist {grid-column: 2;grid-row: 3;margin: 24px 0 0;max-height: calc(100vh - 48px);overflow-y: auto;position: sticky;top: 24px;}
}

.brand-logo{display:block;max-width:150px;width:42%;height:auto;margin:16px auto 0}
.brand-logo-header{display:none}
@media (min-width: 860px) {
  .brand-logo{display:none}
  .brand-logo-header{display:block;max-width:130px;height:auto;margin:0 0 14px}
}
</style>
</head>

      <button class="btn" onclick="prev()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="btn btn-play" onclick="togglePlay()">
        <svg id="iconPlay" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" onclick="next()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></button>

    <div class="volume-row">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>

<audio id="player" preload="auto"></audio>
<script>
const tracks=[
 { title: "En una Noche Azul", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQDhqQONfUW5Qoj0Xu1SvN0mAbmTOp8fxd13_omg1msLCVo?e=ki5dna&download=1" },
  { title: "El Bosque", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQCKZwmOM9MJQYH3qX-NHmkaAcM56e9PpuE0hAvhTTp00Jw?e=nGJ1cK&download=1" },
  { title: "Te Llaman", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQB8G0eT96FwS5uP-JnEI5BaAdPjo5WM1i2RzZY840Bi9fg?e=yubPpB&download=1" },
  { title: "En el País de las Almas Perdidas", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQBu-l1x64aJRKNXrwH-lFaOAQK3U23DX4T9JcGPuCsiqhQ?e=j5P3qq&download=1" },
  { title: "El Éxodo", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQD4wqR840c_SYPFribJ9VmIAcso8s-DfCa1iiPYfMOZ7io?e=fei918&download=1" },
  { title: "Urnas de Asfalto", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQCDSKgOllE4TpbpyeuKln5fAeLp_GOKhEDFd2ipqepgrf8?e=CX5N8J&download=1" },
  { title: "Tu Jaula", url: "https://cur19364667-my.sharepoint.com/:u:/g/personal/ks1070_office365x_org/IQCrLbu3lxtqQbekegMtFhFrARz3pdmPpBDwyYIC0VIEwu0?e=iVs5rD&download=1" },

];

const audio=document.getElementById('player');
let current=-1;
function fmt(s){if(isNaN(s)||s===undefined)return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return`${m}:${sec.toString().padStart(2,'0')}`}
function renderList(){document.getElementById('tracklist').innerHTML=tracks.map((t,i)=>`<div class="track" id="track${i}" onclick="loadTrack(${i})"><div class="eq"><span></span><span></span><span></span></div><div class="loading"></div><div class="track-num">${i+1}</div><div class="track-info"><div class="track-name">${t.title}</div></div><div class="track-dur" id="dur${i}">--:--</div></div>`).join('')}
function setActive(i){document.querySelectorAll('.track').forEach(el=>el.classList.remove('active','playing','buffering'));if(i>=0){document.getElementById(`track${i}`).classList.add('active');document.getElementById(`track${i}`).scrollIntoView({behavior:'smooth',block:'nearest'})}document.getElementById('npTitle').textContent=i>=0?tracks[i].title:'—';document.getElementById('npIndex').textContent=i>=0?`${i+1} de ${tracks.length}`:'—'}
function loadTrack(i){current=i;setActive(i);document.getElementById(`track${i}`).classList.add('buffering');audio.src=tracks[i].url;audio.volume=document.getElementById('volume').value;audio.load();audio.play().catch(()=>{})}
function togglePlay(){if(current<0){loadTrack(0);return}if(audio.paused)audio.play();else audio.pause()}
function prev(){if(current>0)loadTrack(current-1)}
function next(){if(current<tracks.length-1)loadTrack(current+1)}
function setVolume(v){audio.volume=v}
audio.addEventListener('playing',()=>{document.getElementById('iconPlay').style.display='none';document.getElementById('iconPause').style.display='';const el=document.getElementById(`track${current}`);if(el){el.classList.remove('buffering');el.classList.add('playing')}});
audio.addEventListener('pause',()=>{document.getElementById('iconPlay').style.display='';document.getElementById('iconPause').style.display='none';const el=document.getElementById(`track${current}`);if(el)el.classList.remove('playing')});
audio.addEventListener('timeupdate',()=>{const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('timeCurrent').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration)});
audio.addEventListener('loadedmetadata',()=>{document.getElementById(`dur${current}`).textContent=fmt(audio.duration);document.getElementById('timeTotal').textContent=fmt(audio.duration)});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1);else{document.getElementById('iconPlay').style.display='';document.getElementById('iconPause').style.display='none'}});
audio.addEventListener('waiting',()=>{const el=document.getElementById(`track${current}`);if(el){el.classList.remove('playing');el.classList.add('buffering')}});
document.getElementById('progressWrap').addEventListener('click',(e)=>{if(!audio.duration)return;const rect=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration});
function preloadDurations(){tracks.forEach((t,i)=>{const a=new Audio();a.preload='metadata';a.src=t.url;a.addEventListener('loadedmetadata',()=>{t.duration=a.duration;const el=document.getElementById(`dur${i}`);if(el)el.textContent=fmt(a.duration)})})}
renderList();
preloadDurations();
window.addEventListener('load',()=>loadTrack(0));
</script>
